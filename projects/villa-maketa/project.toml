# Villa Maketa — domain config (specs/project-config.md, ADR-006).
# Values a second building would set differently; the machinery that
# consumes them lives in src/archicad_builder/. pipeline.toml stays the
# build graph; steps that read this file declare it in `inputs`.

[project]
title = "Villa Maketa"

# Flat glTF stand-ins for the procedural Blender materials (midpoint of
# each wood ramp / tile color; facade values photo-sampled, linear sRGB —
# facade-finishes.md). A material missing here renders MAGENTA, loudly.
[appearance.palette]
Parquet       = [0.55, 0.40, 0.24, 1.0]
DeckWood      = [0.32, 0.19, 0.10, 1.0]
DoorWood      = [0.38, 0.24, 0.13, 1.0]
FurnitureWood = [0.42, 0.28, 0.16, 1.0]
StairWood     = [0.32, 0.19, 0.10, 1.0]
Wardrobe      = [0.42, 0.31, 0.20, 1.0]
Lawn          = [0.20, 0.42, 0.16, 1.0]
FloorTiles    = [0.55, 0.72, 0.80, 1.0]
FloorHall     = [0.78, 0.72, 0.60, 1.0]
FloorKitchen  = [0.72, 0.66, 0.55, 1.0]
StoneRubble   = [0.479, 0.423, 0.332, 1.0]
Accent        = [0.905, 0.533, 0.072, 1.0]
RoofBrown     = [0.156, 0.076, 0.033, 1.0]
Soffit        = [0.92, 0.92, 0.90, 1.0]

[render]
samples = 128
exposure = -0.6
sun = { sky_elevation_deg = 45, sky_rotation_deg = 135, sky_intensity = 0.5, energy = 2.2, angle_deg = 8.6, rotation_deg = [50, -10, 105] }

[render.camera.perspective]
location = [14.0, 21.0, 8.5]
target = [4.75, 8.5, 0.6]     # DoF focus + track-to
lens = 38
dof_fstop = 5.6
resolution = [1600, 1200]
exposure = -0.85

[render.camera.top]
location = [4.75, 8.75, 30]
ortho_scale = 19.5
resolution = [1100, 2000]
exposure = -0.6

# Terrain: the site drops at the garage front — high ground north of the
# facade line, low ground south of it (render decor, not model geometry).
[[render.ground]]
name = "GroundHigh"
location = [4.75, 67.5, -1.79]
size = [200, 120, 3.0]

[[render.ground]]
name = "GroundLow"
location = [4.75, -52.5, -4.65]
size = [200, 120, 3.0]

# Stair tower (maquette photo #22): the spiral shaft straddles the south
# facade; the protruding half gets a cylindrical shell. cut_y_above trims
# the in-house half so the spiral steps inside stay intact.
[[render.shell]]
name = "StairTower"
center = [6.85, 0.0]
radius = 0.92
inner_radius = 0.80
z_range = [-3.15, 3.0]
cut_y_above = 0.12

[walkthrough]
start = [8.2, 1.7, 4.0]

