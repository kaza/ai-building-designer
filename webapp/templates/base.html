<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Building Designer{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 1100px;
         margin: 0 auto; padding: 24px; background: #14161a; color: #e8e8e8; }
  h1 { font-weight: 600; }
  a { color: #6db2ff; }
  a.cta { display: inline-block; background: #2b7de9; color: #fff; padding: 14px 28px;
          border-radius: 8px; text-decoration: none; font-size: 1.15em; margin: 12px 0 28px; }
  a.cta:hover { background: #3d8bef; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #1e2126; border-radius: 10px; padding: 10px; }
  figure img { width: 100%; border-radius: 6px; display: block; }
  figcaption { padding: 8px 4px 2px; color: #aaa; font-size: 0.92em; }
  .hint { color: #888; font-size: 0.9em; }
  .card { background: #1e2126; border-radius: 10px; padding: 18px; }
  .card h2 { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95em; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2c3038; }
  th { color: #aaa; font-weight: 500; }
  .status-new { color: #ffd166; }
  .status-resolved { color: #7bd88f; }
  .status-rejected { color: #888; }
  .status-in_progress { color: #6db2ff; }
  code { background: #23262c; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
